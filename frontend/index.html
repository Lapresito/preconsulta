<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PreConsulta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-custom">

  <!-- HEADER -->
  <header class="text-center py-4 bg-header shadow-sm">
    <h1 class="mb-0 text-white fw-bold">Fisioterapia - Felipe Mondada</h1>
  </header>

  <div class="container py-4">
    <h1 class="text-center mb-4">BOCETO PRE CONSULTA</h1>

    <form id="preConsultaForm" class="bg-white p-4 rounded shadow">
      <h5>Datos patronímicos</h5>

      <div class="mb-3">
        <label class="form-label">Nombre y apellido</label>
        <input type="text" class="form-control" name="nombre" id="nombre">
      </div>

      <div class="mb-3">
        <label class="form-label">Fecha de nacimiento</label>
        <input type="date" class="form-control" name="fechaNacimiento" id="fechaNacimiento">
        <small class="text-muted" id="edad"></small>
      </div>

      <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="tel" class="form-control" name="telefono" id="telefono">
      </div>

      <div class="mb-3">
        <label class="form-label">Ocupación</label>
        <input type="text" class="form-control" name="ocupacion" id="ocupacion">
      </div>

      <div class="mb-3">
        <label class="form-label">Lugar de residencia</label>
        <input type="text" class="form-control" name="residencia" id="residencia">
      </div>

      <div class="mb-3">
        <label class="form-label">Círculo familiar</label>
        <textarea class="form-control" name="familia" id="familia"></textarea>
      </div>

      <!-- Enfermedades previas -->
      <div class="mb-3">
        <label class="form-label">Enfermedades previas</label>
        <select class="form-select" id="enfermedades" name="enfermedades">
          <option value="">Seleccione...</option>
          <option value="Diabetes">Diabetes</option>
          <option value="Hipertensión">Hipertensión</option>
          <option value="Asma">Asma</option>
          <option value="Otro">Otro</option>
        </select>
        <input type="text" class="form-control mt-2 d-none" id="otraEnfermedad" name="otraEnfermedad" placeholder="Especifique otra enfermedad">
      </div>

      <!-- Implantes electrónicos -->
      <div class="mb-3">
        <label class="form-label">Dispositivo electrónico implantado</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="implante" id="implanteStent" value="Stent">
          <label class="form-check-label" for="implanteStent">Stent</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="implante" id="implanteMarcapasos" value="Marcapasos">
          <label class="form-check-label" for="implanteMarcapasos">Marcapasos</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="implante" id="implanteOtro" value="Otro">
          <label class="form-check-label" for="implanteOtro">Otro</label>
        </div>
        <input type="text" class="form-control mt-2 d-none" id="otroImplante" name="otroImplante" placeholder="Especifique el implante">
      </div>

      <div class="mb-3">
        <label class="form-label">Fármacos que utiliza y mg</label>
        <textarea class="form-control" name="farmacos" id="farmacos"></textarea>
      </div>

      <!-- Género + Body Chart -->
      <div class="mb-3">
        <label class="form-label">Género</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="genero" id="generoHombre" value="hombre" checked>
          <label class="form-check-label" for="generoHombre">Hombre</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="genero" id="generoMujer" value="mujer">
          <label class="form-check-label" for="generoMujer">Mujer</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">BODY CHART</label>
        <p class="text-muted">Marque sobre el esquema corporal las zonas de dolor (azul claro, más pasadas = más oscuro).</p>
        <div class="border p-3 text-center bg-white">
          <canvas id="bodyChart" width="400" height="600" style="border:1px solid #ccc; cursor: crosshair;"></canvas>
        </div>

        <div class="mt-2">
          <button type="button" class="btn btn-secondary btn-sm" id="clearCanvas">Borrar</button>
          <button type="button" class="btn btn-success btn-sm" id="saveCanvas">Guardar imagen</button>
        </div>

        <div class="mt-3">
          <p class="text-muted">Vista previa de la imagen guardada:</p>
          <img id="savedImage" class="img-fluid border rounded" alt="Imagen guardada aparecerá aquí">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Diagnóstico médico (si lo tiene)</label>
        <textarea class="form-control" name="diagnostico" id="diagnostico"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Motivo de consulta</label>
        <textarea class="form-control" name="motivo" id="motivo"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">¿Tiene dolor hace más de tres meses?</label>
        <select class="form-select" name="dolorCronico" id="dolorCronico">
          <option value="Sí">Sí</option>
          <option value="No">No</option>
        </select>
      </div>

      <!-- Campo oculto para enviar la imagen -->
      <input type="hidden" name="bodyChartData" id="bodyChartData">

      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </div>

  <script src="index.js"></script>
</body>
</html>
